name: CI (Angular + Spring) e deploy no Render

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Frontend Angular ─────────────────────────────────────────────────────
  # Compila de verdade: sem isso um erro de TypeScript só apareceria no build
  # da imagem no Render, depois do push.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexo/package-lock.json

      - name: Install dependencies
        working-directory: nexo
        run: npm ci

      - name: Build (produção)
        working-directory: nexo
        run: npx ng build --configuration production --base-href /

  # ── Backend Spring ───────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build jar
        working-directory: backend
        run: mvn -B -ntp clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nexo-backend
          path: backend/target/*.jar

  # ── Deploy ───────────────────────────────────────────────────────────────
  # Só dispara na master e só se os dois builds passaram. O hook é uma URL
  # secreta do Render: bater nela agenda um novo deploy.
  deploy-render:
    needs: [ build-frontend, build-backend ]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dispara o deploy no Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK não está definido no repositório."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
