name: Deploy Nexo (Angular → GitHub Pages)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Permissões exigidas pelo actions/deploy-pages (faltavam antes → o deploy falhava)
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys simultâneos sobrescrevendo um ao outro
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Frontend Angular → GitHub Pages ──────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexo/package-lock.json

      - name: Install dependencies
        working-directory: nexo
        run: npm ci

      - name: Build (produção)
        working-directory: nexo
        run: npx ng build --configuration production --base-href /

      # Fallback de SPA: o GitHub Pages serve 404.html para rotas desconhecidas;
      # copiando o index.html, o deep-link/refresh de qualquer rota Angular funciona.
      - name: SPA fallback (404.html)
        run: cp nexo/dist/nexo/index.html nexo/dist/nexo/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # index.html agora está na RAIZ de dist/nexo (outputPath.browser = "")
          path: nexo/dist/nexo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Backend Spring (empacota o jar como artefato de CI) ──────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build jar
        working-directory: backend
        run: mvn -B -ntp clean package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nexo-backend
          path: backend/target/*.jar
