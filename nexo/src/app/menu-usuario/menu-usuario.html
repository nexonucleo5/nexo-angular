<div class="user-menu-container" #menuRef>
  <button class="menu-trigger" (click)="toggleMenu()" type="button">
    <div class="user-details">
      <span class="user-name">{{ userName() }}</span>
      <span class="user-class">{{ userClass() }}</span>
    </div>

    <div class="avatar-ring">
      <img [src]="userPhoto()" [alt]="userName()" class="avatar-img">
    </div>
    
    <i class="bi bi-chevron-down chevron" [class.open]="menuOpen()"></i>
  </button>

  @if (menuOpen()) {
    <div class="dropdown-panel">
      <a routerLink="/perfil" class="dropdown-item">
        <i class="bi bi-person"></i> Perfil
      </a>
      <a routerLink="/configuracoes" class="dropdown-item">
        <i class="bi bi-gear"></i> Configurações
      </a>
      <!-- Itens desativados conforme seu projeto -->
      <div class="dropdown-item disabled">Notas</div>
      <div class="dropdown-item disabled">Calendário</div>
      
      <div class="dropdown-divider"></div>
      
      <button (click)="signOut()" class="dropdown-item danger">
        <i class="bi bi-box-arrow-right"></i> Sair
      </button>
    </div>
  }
</div>
