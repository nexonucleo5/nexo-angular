<div class="cadastro-container m-3">
    <form class="cadastro-form" id="formCadastro" novalidate>

        <h2 class="cadastro-title">Cadastrar Aluno</h2>
        <p class="cadastro-subtitle">Preencha os dados para finalizar o cadastro</p>

       
        <div id="alertSucesso" class="alert alert-success"></div>
        <div id="alertErro" class="alert alert-danger"></div>

        <fieldset class="border p-3 rounded">
            <div class="row">

                
                <div class="col-md-6 coluna-esquerda">

                    <div class="mb-3">
                        <label class="form-label" for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" class="form-control"
                            placeholder="Digite o nome do aluno">
                        <div class="invalid-feedback" id="erroNome"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00"
                            maxlength="14">
                        <div class="invalid-feedback" id="erroCpf"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label" for="sexo">Sexo:</label>
                            <select id="sexo" name="sexo" class="form-select">
                                <option value="" disabled selected>Selecione</option>
                                <option value="M">Masculino</option>
                                <option value="F">Feminino</option>
                                <option value="N">Não informar</option>
                            </select>
                        </div>

                        <div class="col-4">
                            <label class="form-label" for="telefone">Telefone:</label>
                            <input type="text" id="telefone" name="telefone" class="form-control"
                                placeholder="(DDD) 00000-0000" maxlength="15">
                        </div>

                        <div class="col-4">
                            <label class="form-label" for="dataNascimento">Data de Nascimento:</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" class="form-control">
                            <div class="invalid-feedback" id="erroData"></div>
                        </div>
                    </div>

                   
                    <input type="hidden" id="emailGerado" name="email">
                    <input type="hidden" id="senhaGerada" name="password">

                    <button type="button" id="btnGerarAcesso" class="btn btn-cadastro w-100 mt-3">
                        Gerar Acesso
                    </button>

                </div>

              
                <div class="col-md-6 coluna-direita">

                    <div class="mb-3">
                        <label class="form-label" for="emailResponsavel">E-mail do responsável:</label>
                        <input type="email" id="emailResponsavel" name="emailResponsavel" class="form-control"
                            placeholder="exemplo@gmail.com">
                        <div class="invalid-feedback" id="erroEmailResponsavel"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label" for="cpfResponsavel">CPF Responsável:</label>
                            <input type="text" id="cpfResponsavel" name="cpfResponsavel" class="form-control"
                                placeholder="000.000.000-00" maxlength="14">
                        </div>

                        <div class="col-6">
                            <label class="form-label" for="telefoneResponsavel">Telefone Responsável:</label>
                            <input type="text" id="telefoneResponsavel" name="telefoneResponsavel" class="form-control"
                                placeholder="(DDD) 00000-0000" maxlength="15">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" class="form-control"
                            placeholder="Digite o endereço">
                        <div class="invalid-feedback" id="erroEndereco"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="complemento">Complemento:</label>
                        <input type="text" id="complemento" name="complemento" class="form-control"
                            placeholder="Apto, bloco, casa...">
                    </div>

                    <button type="submit" id="btnFinalizar" class="btn btn-cadastro w-100 mt-3">
                        Finalizar Cadastro
                    </button>

                </div>
            </div>
        </fieldset>

    </form>
</div>
