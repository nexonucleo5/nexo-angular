<div class="login-container">
    <aside class="login-painel">
        <img class="login-painel__logo" src="assets/imagensProjeto/logo-nexo-v2-branco.svg"
            alt="Nexo" width="300" height="90">
    </aside>

    <section class="login-lado">
        <button type="button" class="btn-tema" (click)="alternarTema()"
            [attr.aria-label]="temaEscuro() ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'">
            <svg class="ic" aria-hidden="true"><use [attr.href]="'assets/icones/nexo-icons.svg#ic-' + (temaEscuro() ? 'sun' : 'moon')"></use></svg>
        </button>
        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="realizarLogin()">
            <h1 class="login-title">Entrar</h1>
            <p class="login-subtitle">Acesse sua conta para continuar</p>

            @if (mensagemErro) {
            <div class="alert alert-danger" role="alert">
                <svg class="ic" aria-hidden="true"><use href="assets/icones/nexo-icons.svg#ic-alert"></use></svg>
                <span>{{ mensagemErro }}</span>
            </div>
            }
            @if (mensagemSucesso) {
            <div class="alert alert-success" role="status">
                <svg class="ic" aria-hidden="true"><use href="assets/icones/nexo-icons.svg#ic-check"></use></svg>
                <span>{{ mensagemSucesso }}</span>
            </div>
            }

            <div class="mb-3">
                <label for="username" class="form-label">Login</label>
                <input type="text" id="username" formControlName="username" class="form-control"
                    [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
                    placeholder="Digite seu login">
                <div class="invalid-feedback">O login é obrigatório.</div>
                <div id="emailHelp" class="form-text">
                    Nunca compartilharemos o seu login com ninguém.
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input [type]="mostrarSenha ? 'text' : 'password'" id="password" formControlName="password"
                    class="form-control"
                    [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                    placeholder="Digite sua senha">
                <div class="invalid-feedback">A senha é obrigatória.</div>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox" class="form-check-input" id="togglePassword" (change)="mostrarSenha = !mostrarSenha">
                <label class="form-check-label" for="togglePassword">Mostrar senha</label>
            </div>

            <button type="submit" class="btn btn-login w-100" [disabled]="loginForm.invalid">Entrar</button>
        </form>
    </section>
</div>
