<div class="login-container">
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="realizarLogin()">

        <!-- Logo -->
        <div class="login-brand mb-4 text-center">
            <i class="bi bi-mortarboard-fill brand-icon-login"></i>
            <h1 class="brand-name-login">NEXO</h1>
        </div>

        <h2 class="login-title">Entrar</h2>
        <p class="login-subtitle">Acesse sua conta para continuar</p>

        @if (mensagemErro) {
        <div class="alert alert-danger">{{ mensagemErro }}</div>
        }
        @if (mensagemSucesso) {
        <div class="alert alert-success">{{ mensagemSucesso }}</div>
        }

        <div class="mb-3">
            <label for="username" class="form-label">Login</label>
            <input type="text" id="username" formControlName="username" class="form-control"
                [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
                placeholder="Digite seu login">
            <div class="invalid-feedback">O login é obrigatório (mínimo 3 caracteres).</div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input [type]="mostrarSenha ? 'text' : 'password'" id="password" formControlName="password"
                class="form-control"
                [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                placeholder="Digite sua senha">
            <div class="invalid-feedback">A senha é obrigatória (mínimo 6 caracteres).</div>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" id="togglePassword"
                (change)="mostrarSenha = !mostrarSenha">
            <label class="form-check-label" for="togglePassword">Mostrar senha</label>
        </div>

        <!-- Botão Entrar com estado de loading -->
        <button type="submit" class="btn btn-login w-100 mb-3"
                [disabled]="loginForm.invalid || carregando">
            @if (carregando) {
                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                Entrando...
            } @else {
                Entrar
            }
        </button>

        <!-- Divisor -->
        <div class="login-divider">
            <span>ou</span>
        </div>

        <!-- Botão Cadastre-se -->
        <button type="button" class="btn btn-cadastro-link w-100 mt-3"
                (click)="irParaCadastro()" [disabled]="carregando">
            <i class="bi bi-person-plus me-2"></i>
            Novo aluno? Cadastre-se
        </button>

    </form>
</div>
