<!-- Cada peça tem duas camadas: o "fantasma" (sempre visível, apagado — é ele
     que mantém a palavra NEXO inteira) e a "viva", que acende por cima. -->
<span class="peca peca-clara">
  <img class="fantasma" src="assets/imagensProjeto/logo-nexo-light-metade.png" alt="" draggable="false" />
  <span class="brilho">
    <img class="viva" src="assets/imagensProjeto/logo-nexo-light-metade.png" alt="" draggable="false" />
  </span>
</span>
<span class="peca peca-escura">
  <img class="fantasma" src="assets/imagensProjeto/logo-nexo-dark-metade.png" alt="" draggable="false" />
  <span class="brilho">
    <img class="viva" src="assets/imagensProjeto/logo-nexo-dark-metade.png" alt="" draggable="false" />
  </span>
</span>
<span class="costura" aria-hidden="true"></span>
