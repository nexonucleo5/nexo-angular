@switch (authService.usuarioLogado()?.role) {
  @case ('professor') {
    <app-configuracao-professor></app-configuracao-professor>
  }
  @case ('diretor') {
    <app-configuracao-diretor></app-configuracao-diretor>
  }
  @case ('secretaria') {
    <app-configuracao-secretaria></app-configuracao-secretaria>
  }
  @default {
    <app-configuracao-aluno></app-configuracao-aluno>
  }
}
