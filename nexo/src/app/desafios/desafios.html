<div class="page-container-pushed">
  <section class="page-content p-3">

    <div class="page-heading mb-3">
      <h1 class="page-title fw-bold">Desafios</h1>
      <p class="text-soft fs-5">Complete desafios e ganhe XP para subir no ranking</p>
    </div>

    <section class="stats-section mb-3">
      <div class="row g-3">
        <div class="col-md-4" *ngFor="let stat of stats">
          <div class="stat-card shadow-sm p-3 rounded-4">
            <div>
              <p class="text-soft mb-1">{{stat.label}}</p>
              <h2 class="title-adaptive fw-bold fs-4">{{stat.value}}</h2>
            </div>
            <div class="icon-box" [ngClass]="stat.colorClass">
              <i class="bi" [class]="stat.icon"></i>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="filters-box p-3 rounded-4 shadow-sm mb-3">
      <div class="row g-3 align-items-center">
        <div class="col-lg-6">
          <div class="search-box custom-input d-flex align-items-center px-3 py-2 rounded-pill">
            <i class="bi bi-search me-2 text-secondary"></i>
            <input type="text" [(ngModel)]="buscaDeTermos" class="form-control border-0 bg-transparent shadow-none" placeholder="Buscar desafio...">
          </div>
        </div>
        <div class="col-lg-3">
          <select class="form-select custom-select-input rounded-pill px-3 py-2" [(ngModel)]="materiaSelecionada">
            <option *ngFor="let m of materias" [value]="m">{{m}}</option>
          </select>
        </div>
        <div class="col-lg-3">
          <select class="form-select custom-select-input rounded-pill px-3 py-2" [(ngModel)]="nivelSelecionado">
            <option *ngFor="let n of niveis" [value]="n">{{n}}</option>
          </select>
        </div>
      </div>
    </section>

    <section class="challenge-section mb-4">
      <div class="row g-3">
        <div class="col-md-6 col-xl-4" *ngFor="let desafio of desafiosFiltrados">
          <div class="challenge-card p-4 rounded-4 h-100 d-flex flex-column justify-content-between"
               [class.success]="desafio.status === 'concluido'"
               [class.progress-card]="desafio.status === 'progresso'">
            
            <div>
              <h3 class="title-adaptive fw-bold fs-5 mb-2">
                {{desafio.titulo}}
                <span *ngIf="desafio.status === 'concluido'" class="badge badge-success-custom ms-2">Concluído</span>
              </h3>
              <p class="text-soft small mb-3">{{desafio.materia}}</p>

              <div class="challenge-info d-flex gap-2 align-items-center flex-wrap">
                <span class="level" [ngClass]="getClasseNivel(desafio.nivel)">{{desafio.nivel}}</span>
                <span class="info-tag text-soft">⚡ {{desafio.xp}} XP</span>
                <span class="info-tag text-soft">⏱️ {{desafio.tempo}}</span>
                <span class="info-tag text-soft" *ngIf="desafio.questoes">📝 {{desafio.questoes}} questões</span>
              </div>

              <div class="progress mt-3" *ngIf="desafio.status === 'progresso'" style="height: 6px;">
                <div class="progress-bar" [style.width]="desafio.progresso + '%'"></div>
              </div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <ng-container [ngSwitch]="desafio.status">
                <button *ngSwitchCase="'concluido'" class="btn btn-outline-light w-100 rounded-pill">Ver Resultado</button>
                <button *ngSwitchCase="'concluido'" class="btn btn-primary w-100 rounded-pill">Refazer</button>
                <button *ngSwitchCase="'progresso'" class="btn btn-primary w-100 rounded-pill">Continuar</button>
                <button *ngSwitchDefault class="btn btn-primary w-100 rounded-pill">Iniciar Desafio</button>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </section>
  </section>
</div>
