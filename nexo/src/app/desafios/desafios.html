<div class="page-container">
  <header class="dashboard-header mb-4">
    <h1 class="page-title fw-bold">Desafios</h1>
    <p class="text-soft m-0">Complete desafios e ganhe XP para subir no ranking</p>
  </header>

  <div class="row g-3 mb-4">
    <div class="col-12 col-md-4" *ngFor="let stat of stats">
      <div class="metric-card">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <p class="text-soft small mb-1">{{stat.label}}</p>
            <h2 class="fw-bold mb-0 text-main">{{stat.value}}</h2>
          </div>
          <div class="icon-square" [ngClass]="stat.color">
            <i [class]="'bi ' + stat.icon"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-card p-3 mb-4">
    <div class="row g-2 align-items-center">
      <div class="col-lg-6">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control-custom" [(ngModel)]="buscaDeTermos" placeholder="Buscar por título...">
        </div>
      </div>
      <div class="col-lg-3">
        <select class="form-select-custom" [(ngModel)]="materiaSelecionada">
          <option *ngFor="let m of materias" [value]="m">{{m}}</option>
        </select>
      </div>
      <div class="col-lg-3">
        <select class="form-select-custom" [(ngModel)]="nivelSelecionado">
          <option *ngFor="let n of niveis" [value]="n">{{n}}</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-xl-4" *ngFor="let desafio of desafiosFiltrados">
      <div class="main-card p-4 h-100 d-flex flex-column" [class.active-border]="desafio.status === 'progresso'">
        <div class="d-flex justify-content-between mb-3">
          <span class="level-tag" [ngClass]="getClasseNivel(desafio.nivel)">{{desafio.nivel}}</span>
          <span *ngIf="desafio.status === 'concluido'" class="status-badge success">Concluído</span>
        </div>
        <h3 class="h5 text-main fw-bold mb-1">{{desafio.titulo}}</h3>
        <p class="text-soft small mb-3">{{desafio.materia}}</p>
        <div class="d-flex gap-3 mb-4 mt-auto">
          <span class="text-soft small"><i class="bi bi-lightning-fill text-warning"></i> {{desafio.xp}} XP</span>
          <span class="text-soft small"><i class="bi bi-clock"></i> {{desafio.tempo}}</span>
        </div>
        <div class="progress mb-3" *ngIf="desafio.status === 'progresso'">
          <div class="progress-bar" [style.width]="desafio.progresso + '%'"></div>
        </div>
        <button class="btn btn-outline-main w-100 mt-2" [class.btn-gradient]="desafio.status !== 'concluido'">
          {{ desafio.status === 'concluido' ? 'Ver Resultado' : (desafio.status === 'progresso' ? 'Continuar' : 'Iniciar') }}
        </button>
      </div>
    </div>
  </div>
</div>
