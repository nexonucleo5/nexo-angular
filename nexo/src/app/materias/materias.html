<section class="page-content p-4"> 
    <div class="page-heading mb-4">
        <h1 class="page-title fw-bold" style="font-size: 44px; color: var(--text-main);">
            Minhas Matérias
        </h1>
        <p class="text-soft fs-5">
            Explore todo o conteúdo disponível por disciplina
        </p>
    </div>

    <!-- FILTROS -->
    <section class="filters-box p-4 rounded-4 shadow-sm mb-4">
        <div class="row g-3 align-items-center">

            <!-- BUSCA -->
            <div class="col-lg-8">
                <div class="search-box custom-input d-flex align-items-center px-3 py-2 rounded-pill">
                    <i class="bi bi-search me-2"></i>
                    <input 
                        type="text"
                        [(ngModel)]="buscaDeTermos"
                        class="form-control border-0 bg-transparent shadow-none"
                        placeholder="Buscar matéria..."
                    >
                </div>
            </div>

            <!-- DROPDOWN -->
            <div class="col-lg-4">
                <div class="custom-dropdown w-100">
                    <div 
                        class="custom-input rounded-pill px-3 py-2 d-flex justify-content-between align-items-center"
                        (click)="toggleDropdown()"
                    >
                        {{ selecionarNivel }}
                        <i class="bi bi-chevron-down"></i>
                    </div>

                    <div class="dropdown-menu-custom w-100" *ngIf="dropdownAberto">
                        <div class="dropdown-item" (click)="selecionar('Todos os Níveis')">
                            Todos os Níveis
                        </div>
                        <div class="dropdown-item" (click)="selecionar('Fundamental')">
                            Fundamental
                        </div>
                        <div class="dropdown-item" (click)="selecionar('Médio')">
                            Médio
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- MATÉRIAS -->
    <section class="subjects-section mb-5">
        <div class="row g-4">

            <div class="col-md-6 col-xl-4" *ngFor="let subject of filtroDeBusca">
                <div class="subject-card bg-white p-4 rounded-5 shadow-sm h-100 d-flex flex-column justify-content-between">

                    <div class="subject-header d-flex justify-content-between align-items-start mb-4">
                        <div class="d-flex gap-3">

                            <div 
                                [class]="'subject-icon d-flex align-items-center justify-content-center rounded-4 ' + subject.gradientClass"
                                style="width: 70px; height: 70px; color: rgb(231, 224, 224);"
                            >
                                <!-- VOLTOU PRO ORIGINAL -->
                                <i *ngIf="subject.iconClass" [class]="'bi ' + subject.iconClass + ' fs-2'"></i>
                                <span *ngIf="subject.iconText">
                                    {{subject.iconText}}
                                </span>
                            </div>

                            <div>
                                <h2 class="subject-title">{{subject.title}}</h2>
                                <p class="subject-level-text">{{subject.level}}</p>
                            </div>

                        </div>

                        <span class="badge rounded-pill bg-light fw-bold p-2">
                            ↗ {{subject.progress}}%
                        </span>
                    </div>

                    <div class="subject-progress mb-4">
                        <div class="progress mb-2" style="height: 10px;">
                            <div 
                                [class]="'progress-bar ' + subject.gradientClass"
                                [style.width.%]="subject.progress"
                            ></div>
                        </div>
                        <small class="text-muted">
                            {{subject.completedLessons}}/{{subject.totalLessons}} aulas concluídas
                        </small>
                    </div>

                    <a 
                        href="#"
                        [class]="'btn text-white fw-bold py-3 rounded-4 ' + subject.buttonClass"
                    >
                        Acessar Disciplina
                    </a>
                </div>
            </div>

        </div>
    </section>
</section>
