<div class="app-layout" [class.tela-autenticacao]="!authService.usuarioLogado()">

    @if (authService.usuarioLogado(); as usuario) {
    @if (usuario.role === 'aluno') {
    <app-menu></app-menu>
    } @else {
    <app-menu-diretor></app-menu-diretor>
    }
    }

    <main class="main-content">
        @if (authService.usuarioLogado(); as usuario) {
        <header class="top-header">
            <div class="d-flex align-items-center">
                <h2 class="h4 fw-bold mb-0" style="color: var(--text-main);">
                    {{ usuario.role === 'aluno' ? 'Portal do Aluno' : 'Portal do Diretor' }}
                </h2>

                <button (click)="alternarPerfil()" class="btn btn-sm btn-outline-primary ms-4">
                    Mudar para {{ usuario.role === 'aluno' ? 'Diretor' : 'Aluno' }}
                </button>

                <button (click)="alternarTema()" class="btn-theme ms-2">
                    <i class="bi" [ngClass]="temaEscuro ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
                </button>
            </div>

            <app-menu-usuario [userName]="usuario.nome" [userClass]="usuario.cargo" [userPhoto]="usuario.foto">
            </app-menu-usuario>
        </header>
        }
        <div class="container-fluid p-4">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
