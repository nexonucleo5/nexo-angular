server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas do Angular (refresh em /dashboards, /login etc.) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API do backend no Railway, na mesma origem do site
    location /api/ {
        proxy_pass https://nexo-backend-production-58f3.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host nexo-backend-production-58f3.up.railway.app;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}