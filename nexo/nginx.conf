# Template: só ${BACKEND_HOST} e ${BACKEND_PORT} são substituídos (vêm do ambiente);
# as variáveis do nginx ($host, $uri…) ficam intactas por causa do NGINX_ENVSUBST_FILTER.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;   # foto de perfil (o backend aceita até 3MB)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS do Docker: re-resolve se o backend for recriado com outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://${BACKEND_HOST}:${BACKEND_PORT};

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Service worker e manifest nunca podem ficar em cache, senão o PWA não atualiza.
    location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
