server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload de foto de perfil (ajuste se o backend tiver limite diferente)
    client_max_body_size 10m;

    # Rotas do Angular (refresh em /dashboards, /login etc.) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API do backend no Railway, na mesma origem do site
    location /api/ {
        proxy_pass https://nexo-backend-production-58f3.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host nexo-backend-production-58f3.up.railway.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # WebSocket do chat: front abre /ws/chat?ticket=...
    location /ws/ {
        proxy_pass https://nexo-backend-production-58f3.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host nexo-backend-production-58f3.up.railway.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}