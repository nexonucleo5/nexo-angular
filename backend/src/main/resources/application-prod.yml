# Perfil de PRODUÇÃO — ativar com SPRING_PROFILES_ACTIVE=prod
# Todos os segredos vêm de variáveis de ambiente (nada de valor default sensível).
spring:
  mail:
    # Defina SMTP_HOST (e as demais) para ativar o envio; sem host o JavaMailSender nem é criado.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL}            # ex.: jdbc:postgresql://localhost:5432/nexo
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Cada conexão nova custa um handshake SSL até o Supabase; o pool é mantido
      # pequeno e sempre quente para reaproveitar conexões em vez de reabri-las.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 120000
  jpa:
    hibernate:
      # 'update' relê todo o metadata do schema a cada boot, o que pesa no cold start
      # do plano free. Com o schema já criado, DDL_AUTO=validate (ou none) sobe mais rápido.
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        # Ordena inserts/updates para que o batching acima seja aproveitado.
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: false          # console H2 desligado em produção

# Console em JSON, uma linha por evento, com os campos do MDC (requisicaoId, caminho, usuario):
# o painel do Render e qualquer coletor filtram por campo em vez de procurar texto.
logging:
  structured:
    format:
      console: logstash

nexo:
  jwt:
    secret: ${NEXO_JWT_SECRET}          # OBRIGATÓRIO — sem default em produção
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:https://nexo-gestao-escolar.com.br}
  auth:
    max-tentativas-por-ip: ${AUTH_MAX_TENTATIVAS_IP:100}
    max-refresh-invalidos-por-ip: ${AUTH_MAX_REFRESH_IP:30}
  proxy:
    # 1 = o proxy do Render, que termina o TLS e é quem acrescenta o endereço real do
    # cliente ao fim do X-Forwarded-For. Ajuste se entrar outra camada (CDN, WAF) na
    # frente: cada salto a mais é +1 aqui, senão o IP registrado vira o do intermediário.
    saltos-confiaveis: ${PROXY_SALTOS_CONFIAVEIS:1}
  auditoria:
    # Dias de eventos de auditoria mantidos; o que for mais antigo é apagado às 03:30.
    # Era a única tabela sem teto de crescimento — login e logout gravam um evento cada.
    # Folgado de propósito: a tela consulta por ?periodo=<dias> e um corte curto faria a
    # resposta parecer "sem eventos" onde na verdade foram removidos. 0 desliga.
    retencao-dias: ${AUDITORIA_RETENCAO_DIAS:365}
  recuperacao:
    # Em produção o link é uma credencial por 30 min: nunca vai para o log, e a base é o domínio público.
    log-link: false
    url-base: ${APP_URL_BASE:https://nexo-gestao-escolar.com.br}
  seed:
    enabled: ${SEED_ENABLED:false}      # não semear dados de exemplo em produção
