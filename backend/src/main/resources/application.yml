spring:
  application:
    name: nexo-backend

  # Carrega o .env local (formato properties) para o segredo do JWT não precisar
  # estar exportado no shell. Opcional e nos dois caminhos porque o app tanto é
  # rodado da raiz do repo quanto de dentro de backend/. Em produção não existe
  # arquivo nenhum: as variáveis vêm do ambiente do Render.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  lifecycle:
    # Teto para o desligamento gracioso abaixo: passou disso, encerra à força.
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:h2:file:./data/nexo;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: nexo
    password: nexo
    # Pool dimensionado para container pequeno (Render free/hobby tem 0.5 vCPU):
    # conexão ociosa custa memória no banco e na JVM, e mais conexões que núcleos
    # só aumenta troca de contexto. 10 conexões saturam bem 2-4 vCPUs.
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000        # devolve conexão ociosa em 5 min
      max-lifetime: 900000        # recicla antes do timeout típico de proxy/PaaS
      connection-timeout: 10000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          # Agrupa INSERT/UPDATE numa só ida ao banco (ex.: salvar a chamada de
          # uma turma inteira vira 1 roundtrip em vez de 30).
          batch_size: 30
          # Menos roundtrips ao paginar resultados grandes (relatórios/agregados).
          fetch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        # Carrega associações lazy em lote: N acessos viram ceil(N/25) queries.
        # Rede de segurança para qualquer N+1 que escape das queries explícitas.
        default_batch_fetch_size: 25
        query:
          # O default (2048 planos + 128 metadados) é um dos maiores consumidores
          # de heap ocioso do Hibernate. Esta API tem poucas dezenas de queries.
          plan_cache_max_size: 256
          plan_parameter_metadata_max_size: 64

  # Desligado na base de propósito: este arquivo é o que vale quando nenhum perfil
  # é ativado, e o que vale por omissão precisa ser o seguro. Quem desenvolve liga
  # o console pelo perfil `dev` (application-dev.yml); esquecer de ativar um perfil
  # passa a custar uma ferramenta a menos, e não um console SQL aberto na internet.
  h2:
    console:
      enabled: false
      path: /h2-console

  # Escapa não-ASCII como \uXXXX no JSON — imune a double-encoding de charset
  # (evita mojibake de acentos nas respostas da API); o client decodifica de volta.
  jackson:
    generator:
      escape-non-ascii: true

  # Envio da foto de perfil; o cliente já reduz a imagem antes de mandar.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # Pool que executa o envio de e-mail fora da thread da requisição (EnviadorDeEmail).
  # Pequeno de propósito: SMTP é espera de rede, não trabalho de CPU, e este contêiner tem
  # meio núcleo. A fila é limitada — sem teto ela cresceria até o heap acabar, e o descarte
  # com aviso no log é preferível a um OutOfMemory silencioso.
  task:
    execution:
      pool:
        core-size: 1
        max-size: 3
        queue-capacity: 200
      thread-name-prefix: nexo-async-

  # O JavaMailSender só existe se `spring.mail.host` estiver definida; sem ela o
  # EnviadorDeEmail cai no modo de registro em log. É por isso que host, porta, usuário e
  # senha NÃO aparecem aqui com default vazio: `${MAIL_HOST:}` criaria a propriedade com
  # valor em branco, e a condição que decide o bean olha se ela existe — não se tem
  # conteúdo. O provedor entra por variável de ambiente, que o Spring liga sozinho:
  #
  #   SPRING_MAIL_HOST=smtp.fornecedor-escolhido.com   SPRING_MAIL_PORT=587
  #   SPRING_MAIL_USERNAME=...                         SPRING_MAIL_PASSWORD=...
  #
  # O fornecedor ainda não foi decidido, e o código não depende de qual seja: os serviços
  # de e-mail transacional falam SMTP, então mudar de ideia depois é trocar estas quatro
  # variáveis. Nada aqui precisa ser escrito antes dessa escolha.
  #
  # No .env local, porém, os nomes vão com ponto (spring.mail.host=...): aquele arquivo é
  # lido como .properties e a chave vale ao pé da letra — a tradução de SPRING_MAIL_HOST
  # para spring.mail.host é feita pelo Spring apenas em variável do sistema operacional.
  #
  # spring.mail.password é a chave SMTP gerada no painel do provedor, nunca a senha da
  # conta dele: ela só serve para enviar e-mail e pode ser revogada isoladamente.
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Sem estes dois um provedor lento prende a thread do pool de envio
          # indefinidamente; a fila entope atrás e nenhum e-mail sai mais.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  # Render (e outros PaaS) injetam a porta em $PORT; local cai no 8080
  port: ${PORT:8080}
  # No deploy, para de aceitar conexão nova e deixa as requisições em voo
  # terminarem. Sem isto o SIGTERM corta no meio: quem estava salvando a chamada
  # da turma ou trocando a senha recebe erro de conexão.
  shutdown: graceful
  # Atrás do proxy do Render a conexão real é HTTP; sem isso, request.isSecure()
  # sempre dá false e o header HSTS nunca é emitido em produção.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript,text/javascript,image/svg+xml
    min-response-size: 1024
  tomcat:
    threads:
      # Cada thread do Tomcat reserva ~1 MB de stack. O default (200) dimensiona
      # para uma máquina bem maior do que a que roda esta API; 50 já é folgado
      # para o volume de uma escola e economiza heap/stack no container.
      max: 50
      min-spare: 5
    max-connections: 2000
    accept-count: 100
    connection-timeout: 20000
    # Devolve a thread ociosa (e o buffer dela) em vez de mantê-la presa.
    keep-alive-timeout: 30000

# Só o health sai para a web, e sem detalhe: o /actuator/health é público (é o
# HEALTHCHECK do container que o consulta, sem credencial) e um corpo detalhado
# entregaria a quem perguntasse o endereço do banco e o estado do pool. Quem
# precisar dos detalhes lê o log. Ampliar esta lista exige mexer também no
# SecurityConfig, que nega /actuator/** fora do health.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # O status agregado já considera o indicador do DataSource — banco fora do ar
      # derruba o health para DOWN (503) mesmo sem detalhe nenhum no corpo. O que
      # estas duas linhas escondem é só a decomposição por componente.
      show-details: never
      show-components: never

nexo:
  jwt:
    # Sem default: o segredo vem SEMPRE do ambiente, inclusive em dev (.env local).
    # Gere o seu com `openssl rand -base64 48` — veja o .env.example.
    secret: ${NEXO_JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
  cors:
    # Origem do dev-server Angular
    allowed-origins: http://localhost:4200
  email:
    # Remetente das mensagens. Vazio = sem provedor: o envio vira registro no log, que é
    # como se lê o link de recuperação em desenvolvimento (procure por "E-mail não enviado").
    # Em produção precisa ser um endereço de domínio verificado no provedor.
    remetente: ${EMAIL_REMETENTE:}
    # Onde o link do e-mail aponta — a origem em que o Angular está servido.
    url-base: ${EMAIL_URL_BASE:http://localhost:4200}
  seed:
    # Mesmo motivo do console acima: o seed cria `diretor`, `professor` e `aluno`
    # com senha conhecida (DataSeeder). Ligado na base, bastava subir a aplicação
    # sem perfil nenhum — o que a imagem Docker fazia — para essas três contas
    # existirem. Quem quer os dados de exemplo pede por eles: perfil `dev`.
    enabled: false
