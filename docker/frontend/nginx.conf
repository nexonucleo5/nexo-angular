# Servidor do frontend: estáticos do Angular + proxy reverso para o backend.
#
#   /          → build do Angular (deep-links caem no index.html)
#   /api/      → backend:8080
#   /ws/       → backend:8080 (WebSocket do chat)
#
# O nome "backend" é o serviço do compose. O resolver do Docker (127.0.0.11) com
# o endereço em variável faz o nginx resolver o nome a cada requisição: se o
# backend for recriado e mudar de IP, o proxy acompanha sem precisar reiniciar
# (um upstream fixo guardaria o IP antigo até o próximo reload).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Upload da foto de perfil: o backend aceita até 3MB (spring.servlet.multipart).
    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/manifest+json image/svg+xml;

    # ── API ──────────────────────────────────────────────────────────────────
    # Sem URI no proxy_pass: o caminho original segue intacto (/api/x → /api/x).
    # X-Forwarded-For é anexado, não substituído: o backend conta os saltos
    # confiáveis (PROXY_SALTOS_CONFIAVEIS=1) a partir do fim da lista.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # ── WebSocket do chat ────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Conexão ociosa do chat não pode cair em 60s (default do nginx).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ── Estáticos ────────────────────────────────────────────────────────────
    # Bundles com hash no nome (main-A1B2C3D4.js) nunca mudam de conteúdo:
    # cache de um ano. O que não tem hash (index.html, ngsw.json, manifest,
    # assets) é revalidado a cada uso — um deploy novo nunca fica preso atrás
    # de um index.html velho apontando para hashes que já não existem.
    location ~ "^/[^/]+-[A-Za-z0-9]{8}\.(js|css)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Arquivo com extensão que não existe é 404 de verdade, não index.html:
    # senão um bundle antigo pedido pelo navegador voltaria como HTML disfarçado
    # de JavaScript (mesma regra que o WebConfig do Spring aplicava).
    location ~* "\.[A-Za-z0-9]{1,8}$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Qualquer outra rota é deep-link do Angular (/login, /disciplina/3).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
