# Mesmos cabeçalhos que o Spring aplicava ao index.html quando servia o Angular
# (SecurityConfig). O nginx não herda add_header de um nível para o outro — se o
# location define algum, perde os do server — por isso este arquivo é incluído
# em cada location que serve conteúdo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
