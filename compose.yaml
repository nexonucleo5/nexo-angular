services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Backend acessível em http://localhost:3000

  mobile:
    build:
      context: ./nexo
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Mobile acessível em http://localhost:8080
    depends_on:
      - backend