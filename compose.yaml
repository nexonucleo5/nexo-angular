# docker compose up --build   → http://localhost:8080
# Mais comandos e variáveis em docker/README.md. Atalho: docker/nexo.cmd. Monolito (Render): docker/monolito/compose.yaml.
name: nexo

x-endurecimento: &endurecimento
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  db:
    build:
      context: .
      dockerfile: docker/database/Dockerfile
    image: ${REGISTRY_NAMESPACE:-nexo}/nexo-db:${TAG:-latest}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexo}
      POSTGRES_USER: ${POSTGRES_USER:-nexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - nexo-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    networks: [interna]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    <<: *endurecimento
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: ${REGISTRY_NAMESPACE:-nexo}/nexo-backend:${TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nexo}
      DB_USER: ${POSTGRES_USER:-nexo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      NEXO_JWT_SECRET: ${NEXO_JWT_SECRET:?defina NEXO_JWT_SECRET no .env (openssl rand -base64 48)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PROXY_SALTOS_CONFIAVEIS: 1
      SEED_ENABLED: ${SEED_ENABLED:-true}
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  frontend:
    <<: *endurecimento
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: ${REGISTRY_NAMESPACE:-nexo}/nexo-frontend:${TAG:-latest}
    ports:
      - "${HOST_PORT:-8080}:8080"
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    networks: [interna]

  # Só sobe com --profile registry.
  registry:
    image: registry:2
    profiles: [registry]
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - ./docker/registry/config.yml:/etc/docker/registry/config.yml:ro
      - nexo-registry:/var/lib/registry
    restart: unless-stopped

networks:
  interna:

volumes:
  nexo-pgdata:
  nexo-registry:
